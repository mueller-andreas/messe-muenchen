name: Publish to GitHub Pages

# Spiegelt main auf den gh-pages-Branch, von dem GitHub Pages die Seite
# ausliefert (Settings → Pages → Deploy from a branch → gh-pages / root).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Push main to gh-pages
        run: git push origin HEAD:gh-pages --force
